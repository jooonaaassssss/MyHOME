name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements_test.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Run the schema regression tests
        run: pytest tests -v
